<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18457e" />
      <stop offset="100%" stop-color="#0b203d" />
    </linearGradient>
    <radialGradient id="spinUp" cx="35%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#9ad2fc" />
      <stop offset="100%" stop-color="#4ea3e8" />
    </radialGradient>
    <radialGradient id="spinDown" cx="35%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="55%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </radialGradient>
  </defs>

  <!-- Rounded squircle tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" />
  <rect
    x="2.75"
    y="2.75"
    width="58.5"
    height="58.5"
    rx="13.25"
    fill="none"
    stroke="#93c5fd"
    stroke-opacity="0.24"
    stroke-width="1.5"
  />

  <!-- Central 2x2 Hubbard plaquette glow -->
  <rect x="21" y="21" width="22" height="22" fill="#7cb8e4" fill-opacity="0.1" />

  <!-- Optical lattice beams -->
  <g stroke="#8cc5f0" stroke-opacity="0.46" stroke-width="2.6" stroke-linecap="round">
    <line x1="9.5" y1="21" x2="54.5" y2="21" />
    <line x1="9.5" y1="43" x2="54.5" y2="43" />
    <line x1="21" y1="9.5" x2="21" y2="54.5" />
    <line x1="43" y1="9.5" x2="43" y2="54.5" />
  </g>

  <!-- 2x2 antiferromagnetic fermions on lattice sites -->
  <g stroke="#0e294e" stroke-width="2.4">
    <circle cx="21" cy="21" r="7.4" fill="url(#spinUp)" />
    <circle cx="43" cy="43" r="7.4" fill="url(#spinUp)" />
    <circle cx="43" cy="21" r="7.4" fill="url(#spinDown)" />
    <circle cx="21" cy="43" r="7.4" fill="url(#spinDown)" />
  </g>
</svg>
