        location: Garching, Germany
        start_date: 2023-05
        end_date: present
        highlights:
          - "FermiQP: spin- and charge-resolved lithium quantum gas microscopy in optical lattices"
          - Emergent correlations in the doped Fermi-Hubbard model and multi-orbital Emery model proposals
          - Coherent superlattice rearrangements, entropy-guided cooling, and tensor-network / QMC numerics

      - company: Fudan University
