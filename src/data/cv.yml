cv:
  name: Liyang Qiu
  location: Garching, Germany
  email: liyang.qiu@mpq.mpg.de
  website: https://qiuliyang.github.io
  summary: >-
    Experimental atomic physicist studying strongly correlated fermions and programmable quantum
    dynamics with a lithium quantum gas microscope (FermiQP, MPQ). Research focuses on the
    competition between stripes and d-wave pairing in the doped Fermi-Hubbard model and
    multi-orbital Emery models relevant to cuprates and nickelates, combined with tensor-network
    and quantum Monte Carlo simulations to benchmark data, guide experimental regimes, and design
    microscopic observables.
