# Research map configuration — rendered on /research/ by src/pages/research.astro
# and src/components/research/ResearchMap.tsx.
#
# Paper metadata (title, authors, venue, DOI, arXiv) is pulled automatically from
# src/data/papers.bib by citation key; talk metadata is pulled from src/data/talks.yml
# by ISO date.
#
# Node `mode`: 'experiment' | 'theory' | 'theory-experiment'

columns:
  - id: foundations
    title: Optical & Superlattice Control
    subtitle: Temporal pulse shaping & spatial lattice unitaries
  - id: engineering
    title: State & Hamiltonian Engineering
    subtitle: Composite gates, cooling & multi-band models
  - id: physics
    title: Collective & Correlated Physics
    subtitle: Light–atom ensembles, doped Hubbard & stripes

ongoingWorks:
  - id: stripes-work
    title: Microscopic study of emergent stripe correlations in a doped Fermi-Hubbard simulator
    badge: Ongoing
    venue: FermiQP · Max Planck Institute of Quantum Optics
    description: >-
      Spin- and charge-resolved quantum gas microscopy of emergent stripe correlations and magnetic
      polarons in the doped two-dimensional Fermi-Hubbard model, benchmarked against tensor-network
      and determinant quantum Monte Carlo numerics.

  - id: ttprime-work
    title: Exploring doped regimes of the t–t′ Fermi-Hubbard model in optical lattices
    badge: Ongoing
    venue: FermiQP · Max Planck Institute of Quantum Optics
    description: >-
      Engineering tunable next-nearest-neighbor hopping t′ to break particle–hole symmetry and
      probe kinetic frustration, spin–charge correlations, and pairing tendencies across hole- and
      electron-doped regimes.

  - id: cooling-work
    title: Entropy-guided cooling for low-temperature fermionic quantum simulation
    badge: Ongoing
    venue: FermiQP · Max Planck Institute of Quantum Optics
    description: >-
      Combine theoretical protocol design with site-resolved quantum gas microscope diagnostics to
      shape optical potentials and redistribute entropy into reservoir regions, preparing
      low-entropy correlated fermionic states.

nodes:
  # ─── Column 1: Optical & Superlattice Control (2 nodes) ────────────────────
  - id: waveforms
    column: foundations
    mode: experiment
    title: Optical Waveform & Pulse Shaping
    tagline: Sub-ns shaping, composite AOM & wideband EOM synthesis
    era: Fudan
    summary: >-
      Phase-coherent optical waveform synthesis — combining sub-nanosecond pulse shaping, composite
      acousto-optic modulation, and self-balanced fiber electro-optic amplification — provides fast,
      low-loss control over strong atomic transitions.
    papers:
      - wang2022intense
      - liu2022composite
      - ma2020precise
    talks: []

  - id: rearrangements
    column: foundations
    mode: theory
    title: Coherent Lattice Rearrangements
    tagline: All-to-all U(N) unitaries via tunneling & local phase shifts
    era: MPQ
    summary: >-
      Alternating global superlattice tunneling with site-resolved optical phase shifts synthesizes
      arbitrary single-particle U(N) unitary transformations — a cold-atom counterpart of Clements
      interferometric decomposition with sublinear circuit depth in two dimensions.
    papers:
      - roth2026rearrangements
    talks:
      - '2026-03-16'
      - '2025-12-06'

  # ─── Column 2: State & Hamiltonian Engineering (3 nodes) ───────────────────
  - id: matter-wave
    column: engineering
    mode: theory-experiment
    title: Composite & Ultrafast Matter-Wave Control
    tagline: Nanosecond spin-dependent kicks & composite biased rotations
    era: Fudan
    summary: >-
      Composite sequences of light-shift-biased Raman rotations and shaped sub-nanosecond or
      picosecond pulses realize high-fidelity SU(2) spinor and momentum-space gates even under
      strong optical inhomogeneity, extending to femtosecond two-photon Rabi interferometry.
    papers:
      - chen2024ultrafast
      - qiu2023composite
      - ma2023picosecond
      - qiu2022spinor
      - he2020spinwave
    talks:
      - '2022-07-26'
      - '2022-07-22'
      - '2022-07-08'
      - '2022-06-17'
      - '2022-06-09'

  - id: cooling
    column: engineering
    mode: theory-experiment
    title: Entropy-Guided Cooling
    tagline: Potential shaping & entropy redistribution for low-T fermions
    era: MPQ
    summary: >-
      Reaching correlated regimes of the doped Fermi-Hubbard model requires overcoming entropy
      bottlenecks in optical lattices. Combining theoretical cooling protocols with site-resolved
      microscope thermometry guides tailored optical potentials that partition entropy into
      reservoir regions.
    ongoing:
      - cooling-work
    papers: []
    talks:
      - '2026-03-16'
      - '2026-01-16'

  - id: emery
    column: engineering
    mode: theory
    title: Multi-Band Emery Model
    tagline: Patterned repulsive potentials for 3-band CuO₂ & nickelates
    era: MPQ
    summary: >-
      Superimposing optically projected repulsive potential patterns onto a two-dimensional optical
      lattice realizes the three-orbital Emery model of copper-oxide and infinite-layer nickelate
      planes, with independent control over charge-transfer energy and p–d hybridization.
    papers:
      - lange2026emery
    talks: []

  # ─── Column 3: Collective & Correlated Physics (3 nodes) ───────────────────
  - id: collective
    column: physics
    mode: experiment
    title: Collective Light–Atom Interactions
    tagline: Geometric superradiance, dipolar shifts & slow-light probing
    era: Fudan
    summary: >-
      Imprinting sub-nanosecond spin-wave phase patterns onto dense cold-atom ensembles steers
      collective spontaneous emission geometrically, probes microscopic optical dipole–dipole
      interactions via superradiance, and reconstructs ensemble dynamics from dispersive slow light.
    papers:
      - ji2023superradiant
      - wang2022imaging
      - he2020geometric
    talks: []

  - id: stripes
    column: physics
    mode: experiment
    title: Stripe Correlations in Doped Hubbard
    tagline: Site-resolved spin–charge stripes & magnetic polarons
    era: MPQ
    summary: >-
      Spin- and charge-resolved microscope snapshots reveal how mobile dopants dress and reorganize
      antiferromagnetic order in the 2D Fermi-Hubbard model, tracking emergent spin- and
      charge-stripe correlations alongside DMRG and determinant QMC calculations.
    ongoing:
      - stripes-work
    papers: []
    talks:
      - '2026-07-02'
      - '2026-06-24'
      - '2026-06-20'
      - '2026-06-02'

  - id: ttprime
    column: physics
    mode: experiment
    title: Doped t–t′ Fermi-Hubbard Regimes
    tagline: Diagonal hopping t′, kinetic frustration & doping asymmetry
    era: MPQ
    summary: >-
      Next-nearest-neighbor hopping t′ breaks particle–hole symmetry in the Hubbard model,
      separating hole- and electron-doped regimes and introducing kinetic frustration that reshapes
      spin correlations, stripe stability, and pairing tendencies.
    ongoing:
      - ttprime-work
    papers: []
    talks:
      - '2026-10-12'
      - '2026-08-28'
      - '2026-08-25'

# Directed connections (arranged so the 2–3–3 layout has zero edge crossings).
# kind: 'flow' (direct technical/physical enablement) | 'bridge' (conceptual/theoretical correspondence)
edges:
  - from: waveforms
    to: matter-wave
    kind: flow
    label: Shaped ns/ps optical waveforms drive fast, low-loss Raman & two-photon gates

  - from: rearrangements
    to: matter-wave
    kind: bridge
    shortLabel: SU(2) ↔ U(N)
    label: 'Unitary synthesis from constrained operations: composite SU(2) pulses ↔ U(N) superlattice modes'

  - from: rearrangements
    to: cooling
    kind: flow
    label: Programmable superlattice control & low-defect fermionic state preparation

  - from: matter-wave
    to: collective
    kind: flow
    label: Sub-ns spin-wave phase imprinting steers superradiance & probes dipolar shifts

  - from: cooling
    to: stripes
    kind: flow
    label: Low-entropy state preparation accesses the stripe-ordered temperature regime

  - from: cooling
    to: ttprime
    kind: flow
    label: Low-temperature preparation opens frustrated hole- & electron-doped regimes

  - from: stripes
    to: ttprime
    kind: flow
    label: Extending doped Hubbard stripe physics to next-nearest-neighbor hopping t′

  - from: emery
    to: ttprime
    kind: bridge
    shortLabel: 3-band ↔ 1-band
    label: Three-band CuO₂ Emery model reduces in the Zhang–Rice limit to the effective t–t′ Hubbard model
